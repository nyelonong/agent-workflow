name: Verify

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.11', '3.13']
    env:
      HOME: ${{ runner.temp }}/agent-workflow-home
      PYTHONPYCACHEPREFIX: ${{ runner.temp }}/agent-workflow-pycache
      GIT_TERMINAL_PROMPT: '0'
    steps:
      - name: Create isolated home
        run: mkdir -p "$HOME" "$PYTHONPYCACHEPREFIX"
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Run isolated regression and integration checks
        env:
          GIT_CONFIG_GLOBAL: /dev/null
          GIT_CONFIG_SYSTEM: /dev/null
        run: |
          python3 - <<'PY'
          import hashlib
          import os
          from pathlib import Path
          import subprocess
          import sys

          paths = subprocess.check_output(['git', 'ls-files', '-z']).decode().split('\0')
          paths = [Path(path) for path in paths if path]

          def snapshot():
              return {
                  str(path): (
                      path.lstat().st_mode,
                      os.readlink(path) if path.is_symlink() else hashlib.sha256(path.read_bytes()).hexdigest(),
                  )
                  for path in paths
              }

          before = snapshot()
          for command in (
              [sys.executable, '-m', 'unittest', 'discover', '-s', 'tests', '-v'],
              ['node', '--test', 'tests/test_diff_view.js'],
              ['sh', '-n', 'install.sh'],
              [sys.executable, '-m', 'py_compile', 'scripts/install.py'],
          ):
              subprocess.run(command, check=True)
          if before != snapshot():
              raise SystemExit('Tests changed tracked source bytes, modes or links')
          subprocess.run(['git', 'diff', '--exit-code'], check=True)
          if subprocess.check_output(['git', 'ls-files', '--others', '--exclude-standard', '-z']):
              raise SystemExit('Tests left untracked source files')
          PY
